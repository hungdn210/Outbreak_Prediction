name: Outbreak_Prediction
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Core numerics & data
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - pyarrow
  - joblib>=1.3
  - cython
  # Modeling
  - scikit-learn>=1.4,<1.6
  - imbalanced-learn>=0.12
  - xgboost>=2.0
  - lightgbm>=4.0
  - catboost>=1.2
  # Plotting / utils
  - matplotlib
  - tqdm
  # Notebooks / kernels (optional)
  - jupyterlab
  - ipykernel
  # Repro / lint (optional)
  - black
  - isort
  - pre-commit
  - pip
  - pip:
      # add extra pip-only packages here if you need them later, e.g.:
      # - scikit-multilearn
